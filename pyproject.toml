# uv (used by Vercel) reads this so RapidOCR does not also pull full opencv-python.
[project]
name = "akshar"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "python-multipart>=0.0.12",
  "pymupdf>=1.24",
  "pillow>=10",
  "opencv-python-headless>=4.10",
  "numpy>=1.26,<3",
  "rapidocr>=3.0",
  "onnxruntime>=1.18",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "supabase>=2.10",
]

[tool.uv]
# RapidOCR declares opencv-python; rewrite that requirement to the headless wheel below.

[[tool.uv.dependency-metadata]]
name = "rapidocr"
requires-dist = [
  "pyclipper>=1.2.0",
  "opencv-python-headless>=4.5.1.48",
  "numpy>=1.19.5,<3.0.0",
  "six>=1.15.0",
  "Shapely!=2.0.4,>=1.7.1",
  "PyYAML",
  "Pillow",
  "tqdm",
  "omegaconf!=2.2.1",
  "requests",
  "colorlog",
]
